[supervisord]
logfile=logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=logs/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor_eset_soc.sock

[unix_http_server]
file=/tmp/supervisor_eset_soc.sock

[program:api]
; src.main:app's lifespan() (src/main.py) starts the UDP/TCP syslog listeners
; (src/services/syslog_runtime.py) embedded in this same process — this is the
; only syslog listener supervisord needs to start. A separate [program:syslog_server]
; running syslog_server.server (the legacy standalone entrypoint) would try to bind
; the same UDP/TCP ports a second time and fail — see docs/SOC_LITE_AUDIT.md §4.1/§17.
command=.venv/bin/uvicorn src.main:app --host %(ENV_APP_HOST)s --port %(ENV_APP_PORT)s
directory=.
autostart=true
autorestart=true
stdout_logfile=logs/app.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=logs/app.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=APP_HOST="0.0.0.0",APP_PORT="8000"
